[project]
name = "synapses"
version = "0.1.0"
description = "Exploration of representation learning and mechanistic interpretability."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "einops>=0.8",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
# Embedding visualization (t-SNE / UMAP) for weeks 1–2
viz = [
    "umap-learn>=0.5",
    "seaborn>=0.13",
]
# Weeks 3–4: SAEs + mechanistic interpretability
interp = [
    "transformers>=4.44",
    "datasets>=2.20",
    "transformer-lens>=2.0",
]
# Setup smoke test (Stable Diffusion) — mirrors ../PythonSnippets/generative_ai/use_diffuser.py
diffusers = [
    "diffusers>=0.30",
    "transformers>=4.44",
    "accelerate>=0.33",
]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synapses"]

# --- PyTorch source selection -------------------------------------------------
# On Linux (the PC / WSL, RTX 4090) pull the CUDA 12.4 build of torch.
# On macOS (this machine) fall back to the default PyPI wheel (CPU / MPS).
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]

[tool.ruff]
line-length = 100
target-version = "py311"
